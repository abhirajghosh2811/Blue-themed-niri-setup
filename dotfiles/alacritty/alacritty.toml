
[window]
opacity = 0.96
padding = { x = 12, y = 12 }
decorations = "None"

[font]
size = 11.5

[font.normal]
family = "monospace"
style = "Regular"

[font.bold]
family = "monospace"
style = "Bold"

[colors.primary]
background = "#080B12"
foreground = "#C5D4E8"

[colors.cursor]
text = "#080B12"
cursor = "#4C82C3"

[colors.selection]
text = "#FFFFFF"
background = "#1E3A5F"

[colors.normal]
black = "#080B12"
red = "#C46B78"
green = "#8BAF9A"
yellow = "#C5AA78"
blue = "#4C82C3"
magenta = "#9279B8"
cyan = "#6CABB8"
white = "#C5D4E8"

[colors.bright]
black = "#39465A"
red = "#D9828F"
green = "#A5C6AE"
yellow = "#D9BE8C"
blue = "#75A4DF"
magenta = "#AD93D2"
cyan = "#8BC4D0"
white = "#EDF3FC"

[keyboard]
bindings = [
    { key = "C", mods = "Control", action = "Copy" },
    { key = "V", mods = "Control", action = "Paste" },
    { key = "N", mods = "Control", action = "SpawnNewInstance" },
    { key = "Space", mods = "Control", action = "ToggleViMode" },
    { key = "Plus", mods = "Control", action = "IncreaseFontSize" },
    { key = "Minus", mods = "Control", action = "DecreaseFontSize" },
    { key = "Key0", mods = "Control", action = "ResetFontSize" },
]
